<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Emerald & Forest -->
    <linearGradient id="zmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Electric Bolt Gradient: Ultra-Vivid Gold & Amber -->
    <linearGradient id="zmBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Device Bag Glow Filter -->
    <filter id="zmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#zmBg)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" />

  <!-- Corner Tech Circuit Nodes (Electronics Symbolism) -->
  <path d="M10 18h6v-8" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7" />
  <circle cx="10" cy="18" r="2" fill="#6ee7b7" />
  <circle cx="16" cy="10" r="2" fill="#6ee7b7" />

  <path d="M54 46h-6v8" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7" />
  <circle cx="54" cy="46" r="2" fill="#6ee7b7" />
  <circle cx="48" cy="54" r="2" fill="#6ee7b7" />

  <!-- Electronics Marketplace Bag Base -->
  <path d="M18 25c0-1.657 1.343-3 3-3h22c1.657 0 3 1.343 3 3v21c0 4.418-3.582 8-8 8H26c-4.418 0-8-3.582-8-8V25z" 
        fill="#0f172a" 
        stroke="#10b981" 
        stroke-width="2.5" 
        filter="url(#zmGlow)" />

  <!-- Bag Handles -->
  <path d="M25 22v-5a7 7 0 0 1 14 0v5" 
        stroke="#6ee7b7" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Electronics Thunderbolt / Zest Power Symbol (High Contrast) -->
  <path d="M34 26L23 39h9l-3 12 14-15h-9l4-10z" 
        fill="url(#zmBolt)" 
        stroke="#9a3412" 
        stroke-width="0.8" 
        stroke-linejoin="round" />

  <!-- Glowing LED Live Indicator Dot -->
  <circle cx="48" cy="16" r="3.5" fill="#22c55e" />
  <circle cx="48" cy="16" r="1.75" fill="#ffffff" />
</svg>

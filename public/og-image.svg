<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Microchip Circuit Grid Lines in Background -->
  <g opacity="0.1" stroke="#34d399" stroke-width="1.5">
    <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200" />
    <path d="M 150 0 V 630 M 300 0 V 630 M 450 0 V 630 M 600 0 V 630 M 750 0 V 630 M 900 0 V 630 M 1050 0 V 630" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(100, 100)">
    <!-- Brand Logo Mark & Name -->
    <g transform="translate(0, 0)">
      <rect width="64" height="64" rx="16" fill="url(#logoGrad)" />
      <path d="M 22 20 H 42 L 26 44 H 42" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="80" y="44" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
        Zest<tspan fill="#34d399">Mart</tspan>
      </text>

      <rect x="270" y="16" width="46" height="28" rx="6" fill="#047857" />
      <text x="293" y="35" fill="#a7f3d0" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
        PK
      </text>
    </g>

    <!-- Tagline Kicker -->
    <text x="0" y="125" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="2">
      PAKISTAN'S ULTIMATE ELECTRONICS MARKETPLACE
    </text>

    <!-- Main Headline -->
    <text x="0" y="190" fill="#ffffff" font-family="Cabinet Grotesk, Plus Jakarta Sans, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Official PTA Approved Flagships &amp;
    </text>
    <text x="0" y="245" fill="#ffffff" font-family="Cabinet Grotesk, Plus Jakarta Sans, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Computing Hardware Hub.
    </text>

    <!-- Description -->
    <text x="0" y="300" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="500">
      Multi-vendor smartphones, laptops, GPUs &amp; gaming rigs across 250+ cities.
    </text>

    <!-- Trust Badges Row -->
    <g transform="translate(0, 360)">
      <!-- Badge 1 -->
      <rect width="210" height="50" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1.5" />
      <text x="20" y="31" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700">✓ 100% PTA Tax-Paid</text>

      <!-- Badge 2 -->
      <g transform="translate(225, 0)">
        <rect width="200" height="50" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1.5" />
        <text x="20" y="31" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700">✓ Nationwide COD</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(440, 0)">
        <rect width="220" height="50" rx="12" fill="#0f172a" stroke="#047857" stroke-width="1.5" />
        <text x="20" y="31" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="700">✓ 7-Day Replacement</text>
      </g>
    </g>
  </g>

  <!-- Right Visual / Hardware Showcase Emblem -->
  <g transform="translate(850, 160)">
    <!-- Soft Glow Backdrop -->
    <circle cx="160" cy="160" r="160" fill="#059669" fill-opacity="0.2" />
    <circle cx="160" cy="160" r="120" stroke="#10b981" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

    <!-- Tech Emblem Frame -->
    <rect x="50" y="50" width="220" height="220" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    
    <!-- Lightning & Microchip Device Glyph -->
    <path d="M 160 80 L 120 160 H 160 L 140 240 L 200 150 H 160 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Bottom Verified Flag -->
    <rect x="70" y="235" width="180" height="34" rx="8" fill="#047857" />
    <text x="160" y="257" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">
      VERIFIED IMPORTERS
    </text>
  </g>

  <!-- Bottom URL Tag -->
  <text x="100" y="580" fill="#64748b" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="600">
    https://zestmart.pk · Karachi · Lahore · Islamabad
  </text>
</svg>
